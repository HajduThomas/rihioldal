<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihi Gaming Elrendezés</title>

    <style>
        /* SAJÁT BETŰTÍPUS */
        @font-face {
            font-family: 'Sigmar One';
            src: url('fonts/SigmarOne-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .bottom-image {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .blurred-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('hatter.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(15px);
            transform: scale(1.1);
            z-index: 1;
        }

        .bottom-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column; /* Függőleges elrendezés: szöveg fent, ikonok lent */
            justify-content: center;
            align-items: center;
            height: 100%;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #dynamic-text {
            font-family: 'Sigmar One', sans-serif;
            font-size: 4em;
            margin: 0 0 20px 0; /* Alsó margó az ikonok elválasztásához */
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* Közösségi média ikonok konténere */
        .social-links {
            display: flex;
            gap: 25px; /* Távolság az ikonok között */
            align-items: center;
        }

        .social-link {
            display: inline-block;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .social-link img {
            width: 45px; /* Ikonok szélessége */
            height: auto;
            display: block;
            filter: drop-shadow(0px 2px 5px rgba(0, 0, 0, 0.5));
        }

        /* Egérráhúzás effekt */
        .social-link:hover {
            transform: scale(1.15);
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="bottom-image">
            <div class="blurred-background"></div>

            <div class="bottom-content">
                <p id="dynamic-text">HAMAROSAN.</p>
                
                <!-- Linkelt ikonok -->
                <div class="social-links">
                    <a href="https://www.youtube.com/@rihigaming1" target="_blank" rel="noopener noreferrer" class="social-link">
                        <img src="yt logo (1).png" alt="YouTube csatorna">
                    </a>
                    <a href="https://www.twitch.tv/rihigaming_official" target="_blank" rel="noopener noreferrer" class="social-link">
                        <img src="images (4) (1).png" alt="Twitch csatorna">
                    </a>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
