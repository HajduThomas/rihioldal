<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Értesítések - Rihi Gaming</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpg" href="img/profil.jpg">
    <!-- EMAILJS SDK BEILLESZTÉSE -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        emailjs.init("7sFtBdiCMPosmyRpQ"); // <-- Ide illeszd be a Public Key-t!
    </script>
</head>
<body>

    <div class="container">
        <div class="bottom-image">
            <div class="blurred-background"></div>

            <!-- VISSZA A FŐOLDALRA GOMB -->
            <a href="home.html" class="home-button" style="text-decoration: none;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                <span>Vissza a Főoldalra</span>
            </a>

            <!-- PROFIL BLOKK -->
            <div class="profile-container-700px">
                <div class="side-group horizontal">
                    <a href="home.html#rolunk" class="nav-btn">Rólunk</a>
                    <a href="setup.html" class="nav-btn">Setup</a>
                </div>

                <a href="https://www.youtube.com/@rihigaming1" target="_blank" class="profile-link">
                    <img src="img/profil.jpg" alt="Rihi Gaming Profil" class="profile-pic">
                </a>

                <div class="side-group horizontal">
                    <a href="ertesito.html" class="nav-btn notif-btn active">Értesítés</a>
                    <a href="szabalyzat.html" class="nav-btn">Szabályzat</a>
                </div>
            </div>

            <!-- ÉRTESÍTÉSEK KONTÉNER -->
            <div class="notifications-wrapper">
                <div class="notifications-box">
                    <h2>Legújabb Értesítések</h2>
                    <p class="notif-subtitle">Kattints a buborékra a tartalom megtekintéséhez!</p>

                    <!-- Értesítési buborékok helye -->
                    <div class="notifications-list" id="notificationsList"></div>

                    <!-- E-MAIL FELIRATKOZÁSI DOBOZ -->
                    <div class="subscribe-box">
                        <h3>✉️ Kérj e-mail értesítést!</h3>
                        <p>Iratkozz fel, hogy azonnal e-mailt kapj, ha új videó vagy live indul!</p>
                        <form id="subscribeForm" class="subscribe-form">
                            <input type="email" id="subscriberEmail" placeholder="Add meg az e-mail címed..." required>
                            <button type="submit" class="subscribe-btn">Feliratkozás</button>
                        </form>
                        <p id="subscribeStatus" class="subscribe-status"></p>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
