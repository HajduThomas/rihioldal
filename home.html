<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>

    <div class="container">

            <!-- KIJELENTKEZÉS GOMB (Bal felső sarok) -->

            <!-- 700PX POZÍCIÓJÚ PROFIL BLOKK -->
            <div class="profile-container-700px">
                
                <!-- BAL OLDALI GOMBOK (EGYMÁS MELLETT) -->
                <div class="side-group horizontal">
                    <a href="#rolunk" class="nav-btn">Rólunk</a>
                    <a href="#setup" class="nav-btn">Setup</a>
                </div>

                <!-- KÖZÉPSŐ PROFILKÉP -->
                <img src="img/profil.jpg" alt="Rihi Gaming Profil" class="profile-pic">

                <!-- JOBB OLDALI GOMBOK (EGYMÁS MELLETT) -->

                    <a href="#ertesites" class="nav-btn">Értesítés</a>
                    
                    <div class="dropdown">
                        <button class="nav-btn dropdown-btn">
                            Szabályzat &#9662;
                        </button>
                        <div class="dropdown-content">
                            <a href="#szabalyzat-discord">Discord</a>
                            <a href="#szabalyzat-twitch">Twitch</a>
                            <a href="#szabalyzat-youtube">YouTube</a>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
